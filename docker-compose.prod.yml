services:
  db:
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: prod_user
      POSTGRES_DB: portfolio_prod

  app:
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DB_PASSWORD: ${DB_PASSWORD}

      POSTGRES_DB: portfolio_prod
      DB_USERNAME: prod_user

      APP_PROFILE: prod
      CORS_ALLOWED_ORIGINS: https://portfolio.kimuworks.dev
      COOKIE_SECURE: true
      COOKIE_SAME_SITE: None

  nginx:
    volumes:
    - ./nginx/certs/live/portfolio-api.kimuworks.dev:/etc/nginx/certs/live/portfolio-api.kimuworks.dev:ro
    - certbot-webroot:/var/www/certbot:ro
    - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  certbot:
    image: certbot/certbot
    container_name: portfolio-certbot
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot