# nginx/nginx.conf

events { }
http {
    # ------------------------------------
    # アプリケーションコンテナへのアップストリーム設定
    # ------------------------------------
    upstream backend {
        # Spring Bootアプリのサービス名 'app' とポート '8080' を指定
        server app:8080;
    }

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    # ------------------------------------
    # HTTP (80) サーバー設定
    # ------------------------------------
    server {
        listen 80;
        server_name portfolio-api.kimuworks.dev;
        # SSL証明書取得 (Certbot) 用のlocation
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        # それ以外のHTTPアクセスは全てHTTPSにリダイレクト
        return 301 https://$host$request_uri;
        # location / {
        #     return 404;
        # }
    }

    # ------------------------------------
    # HTTPS (443) サーバー設定
    # ------------------------------------
    server {
        listen 443 ssl;
        server_name portfolio-api.kimuworks.dev;

        # ★★★ 証明書のパス。Certbot取得後に配置するパスを仮置き ★★★
        ssl_certificate /etc/nginx/certs/live/portfolio-api.kimuworks.dev/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/portfolio-api.kimuworks.dev/privkey.pem;

        ssl_session_timeout 1d;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;

        location / {
            # アプリケーションコンテナへのリバースプロキシ
            proxy_pass http://backend;

            # Spring BootがHTTPSで受け取ったと認識させるためのヘッダ
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;

            # CookieのSecure属性をNginxが設定するための設定
            # (アプリケーション側で secure=true, sameSite=None が前提)
            proxy_cookie_path / "/; secure; SameSite=None";
        }
    }
}