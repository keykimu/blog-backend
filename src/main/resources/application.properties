spring.application.name=portfolio

# データベース接続 (ホストはコンテナ名 'db' に統一)
spring.datasource.url=jdbc:postgresql://db:5432/${POSTGRES_DB}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.output.encoding=UTF-8

# ロギング
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.mybatis=INFO
logging.level.com.example.portfolio=INFO

# ログの設定を追加
# 環境変数 LOGGING_FILE_NAME があればそれを使い、なければ logs/application.log を使う
logging.file.name=${LOGGING_FILE_NAME:logs/application.log}

# ログローテーションの設定（10MBごとに区切って、7日分残す）
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# Mybatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.portfolio.entity

# JWT Secret
jwt.secret = ${JWT_SECRET:defaultSecret}

# ローカル実行
spring.profiles.active=${APP_PROFILE:local}

# CORS & Cookie
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
cookie.secure=${COOKIE_SECURE:false}
cookie.same-site=${COOKIE_SAME_SITE:Lax}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

server.forward-headers-strategy=native
server.use-forward-headers=true
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.relaxed-path-chars=|, {, }, [, ], ,,
server.tomcat.relaxed-query-chars=|, {, }, [, ], ,,