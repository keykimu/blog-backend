spring.application.name=portfolio

# データベース接続 (ホストはコンテナ名 'db' に統一)
spring.datasource.url=jdbc:postgresql://db:5432/${DB_NAME:portfolio}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.output.encoding=UTF-8

# ロギング
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.mybatis=INFO
logging.level.com.example.portfolio=INFO

# Mybatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.portfolio.entity

# JWT Secret
jwt.secret = ${JWT_SECRET:defaultSecret}

# ローカル実行
spring.profiles.active=${APP_PROFILE:local}

# CORS & Cookie
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
cookie.secure=${COOKIE_SECURE:false}
cookie.same-site=${COOKIE_SAME_SITE:Lax}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true